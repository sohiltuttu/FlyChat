<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlyChat</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b0f19; color: #e0e6ed; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        h2 { text-align: center; color: #4da6ff; margin-bottom: 20px; }
        
        .welcome-card { background-color: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 15px 20px; margin-bottom: 20px; text-align: center; }
        .welcome-card h3 { color: #60a5fa; margin-top: 0; margin-bottom: 8px; font-size: 18px; }
        .welcome-card p { color: #9ca3af; font-size: 14px; margin: 0; line-height: 1.5; }

        #warning-msg { text-align: center; margin-bottom: 10px; display: none; font-size: 14px; font-weight: bold; }
        #error-msg { color: #ef4444; text-align: center; margin-bottom: 15px; display: none; font-size: 14px; font-weight: bold; padding: 10px; background-color: #7f1d1d; border-radius: 6px; border: 1px solid #b91c1c; }
        
        #room-selection { display: flex; justify-content: center; background-color: #111827; padding: 20px; border-radius: 8px; border: 1px solid #1f2937; margin-bottom: 15px; }
        #roomInput { padding: 12px; border: 1px solid #374151; border-radius: 6px; background-color: #1f2937; color: #fff; margin-right: 10px; width: 220px; outline: none; }

        button { padding: 10px 14px; border: none; border-radius: 6px; background-color: #2563eb; color: #fff; cursor: pointer; font-weight: bold; transition: background 0.2s; margin-left: 4px; }
        button:hover { background-color: #1d4ed8; }
        .btn-danger { background-color: #dc2626; }
        .btn-danger:hover { background-color: #b91c1c; }
        .btn-icon { background-color: #374151; }
        .btn-icon:hover { background-color: #4b5563; }

        #chat-header { display: none; justify-content: space-between; align-items: center; background-color: #111827; padding: 10px 15px; border-radius: 8px 8px 0 0; border-bottom: 1px solid #1f2937; }
        #chat { border: 1px solid #1f2937; height: 400px; overflow-y: auto; padding: 20px; border-radius: 0 0 8px 8px; background-color: #111827; margin-bottom: 15px; display: flex; flex-direction: column; }
        .message { margin-bottom: 12px; padding: 10px 16px; border-radius: 18px; max-width: 70%; word-wrap: break-word; font-size: 15px; position: relative; }
        .message img, .message video { max-width: 100%; border-radius: 8px; margin-top: 5px; display: block; }
        .message audio { max-width: 100%; margin-top: 5px; display: block; }
        .sent { background-color: #2563eb; color: #ffffff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .received { background-color: #1f2937; color: #e0e6ed; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #374151; }
        .system { color: #9ca3af; text-align: center; font-style: italic; align-self: center; font-size: 13px; margin: 8px 0; }
        
        .reply-box { background: rgba(0, 0, 0, 0.3); border-left: 3px solid #60a5fa; padding: 4px 8px; font-size: 12px; margin-bottom: 6px; border-radius: 4px; color: #9ca3af; }
        .reply-btn { font-size: 11px; opacity: 0.8; cursor: pointer; margin-top: 4px; display: inline-block; text-decoration: underline; }
        .reply-btn:hover { opacity: 1; }

        #reply-bar { display: none; background-color: #1f2937; border: 1px solid #374151; padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; justify-content: space-between; align-items: center; font-size: 13px; }
        #reply-bar-text { color: #9ca3af; white-space: overflow: hidden; text-overflow: ellipsis; max-width: 80%; }

        #message-form { display: none; flex-direction: column; background-color: #111827; padding: 10px; border-radius: 8px; border: 1px solid #1f2937; }
        #input-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        #messageInput { flex: 1; padding: 12px; border: 1px solid #374151; border-radius: 6px; background-color: #1f2937; color: #fff; outline: none; }

        #recording-controls { display: none; align-items: center; gap: 8px; flex: 1; }
        #timer { color: #ef4444; font-weight: bold; font-family: monospace; font-size: 16px; margin: 0 10px; }

        #media-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; flex-direction: column; }
        #media-preview-container { max-width: 80%; max-height: 60%; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; }
        #media-preview-container img, #media-preview-container video { max-width: 100%; max-height: 50vh; border-radius: 8px; object-fit: contain; }

        #call-controls { display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>FlyChat</h2>
        
        <div class="welcome-card" id="welcome-box">
            <h3>Welcome to FlyChat 💬</h3>
            <p>Enter a unique room code below to create or join a chat room.</p>
        </div>

        <div id="warning-msg"></div>
        <div id="error-msg"></div>

        <div id="room-selection">
            <input type="text" id="roomInput" placeholder="Enter Room Code">
            <button onclick="joinRoom()">Join / Create</button>
        </div>

        <div id="chat-header">
            <span id="room-display" style="font-weight: bold; color: #60a5fa;"></span>
            <div id="call-controls">
                <button id="start-call-btn" onclick="startCall()">📞 Call</button>
                <button id="mute-btn" class="btn-icon" onclick="toggleMute()" style="display:none;">🎤 Mute</button>
                <button id="speaker-btn" class="btn-icon" onclick="toggleAudioOutput()" style="display:none;" title="Switch Audio Output">🔊</button>
                <button id="end-call-btn" class="btn-danger" onclick="endCall()" style="display:none;">Hang Up</button>
            </div>
            <button class="btn-danger" onclick="leaveRoom()">Exit Room</button>
        </div>

        <div id="chat" style="display: none;"></div>

        <div id="message-form">
            <div id="reply-bar">
                <span id="reply-bar-text">Replying to...</span>
                <button onclick="cancelReply()" style="background: transparent; color: #ef4444; padding: 2px 6px; margin: 0;">✕</button>
            </div>

            <div id="input-row">
                <div id="text-controls" style="display: flex; flex: 1; align-items: center;">
                    <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
                    <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;" onchange="handleMediaSelect(event)">
                    <button class="btn-icon" onclick="document.getElementById('mediaInput').click()" title="Send Image/Video">📁</button>
                    <button class="btn-icon" onclick="startRecording()" title="Record Voice">🎤</button>
                    <button onclick="sendMessage()">Send</button>
                </div>

                <div id="recording-controls">
                    <span id="timer">00:00</span>
                    <button class="btn-icon" id="pauseBtn" onclick="togglePause()" title="Pause/Resume">⏸️</button>
                    <button class="btn-danger" onclick="cancelRecording()" title="Cancel Recording">🗑️ Cancel</button>
                    <button style="background-color: #10b981;" onclick="stopAndSendRecording()" title="Send Voice">📤 Send Voice</button>
                </div>
            </div>
        </div>
    </div>

    <div id="media-modal">
        <div id="media-preview-container"></div>
        <div>
            <button style="background-color: #10b981;" onclick="confirmSendMedia()">Send</button>
            <button class="btn-danger" onclick="cancelMediaPreview()">Cancel</button>
        </div>
    </div>

    <audio id="remote-audio" autoplay></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentRoom = "";
        let mediaRecorder;
        let audioChunks = [];
        let timerInterval;
        let secondsElapsed = 0;
        let isCancelled = false;

        let activeReply = null;
        let selectedMedia = { data: null, type: null };

        let localStream;
        let peerConnection;
        const config = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        const remoteAudio = document.getElementById('remote-audio');
        const startCallBtn = document.getElementById('start-call-btn');
        const muteBtn = document.getElementById('mute-btn');
        const endCallBtn = document.getElementById('end-call-btn');
        const speakerBtn = document.getElementById('speaker-btn');

        let audioDevices = [];
        let currentDeviceIndex = 0;

        const roomInput = document.getElementById('roomInput');
        const warningMsg = document.getElementById('warning-msg');

        roomInput.addEventListener('input', () => {
            const code = roomInput.value.trim();
            const hasAlpha = /[a-zA-Z]/.test(code);
            const hasNumber = /[0-9]/.test(code);
            const hasSpecial = /[^A-Za-z0-9]/.test(code);
            const hasOnlyLetters = /^[a-zA-Z]+$/.test(code);

            if (code.length === 0) {
                warningMsg.style.display = 'none';
            } else if (hasOnlyLetters && code.length <= 4) {
                warningMsg.innerText = "⚠️ Weak (Letters only)";
                warningMsg.style.display = 'block';
                warningMsg.style.color = '#f59e0b'; // Yellow
            } else if (code.length >= 5 && hasAlpha && hasNumber && !hasSpecial) {
                warningMsg.innerText = "🔵 Moderate (Letters & Numbers)";
                warningMsg.style.display = 'block';
                warningMsg.style.color = '#60a5fa'; // Blue
            } else if (code.length >= 6 && hasAlpha && hasNumber && hasSpecial) {
                warningMsg.innerText = "🔒 Perfect! You are secure.";
                warningMsg.style.display = 'block';
                warningMsg.style.color = '#10b981'; // Green
            } else if (code.length > 0) {
                warningMsg.innerText = "ℹ️ Combine Letters, Numbers & Symbols for better security.";
                warningMsg.style.display = 'block';
                warningMsg.style.color = '#9ca3af';
            }
        });

        function joinRoom() {
            const roomCode = roomInput.value.trim();
            const errorDiv = document.getElementById('error-msg');
            errorDiv.style.display = 'none';

            if (!roomCode) return;

            currentRoom = roomCode;
            socket.emit('join-room', currentRoom);
        }

        function leaveRoom() {
            if (currentRoom) {
                endCall();
                socket.emit('leave-room', currentRoom);
            }
        }

        socket.on('joined', (room) => {
            document.getElementById('welcome-box').style.display = 'none';
            warningMsg.style.display = 'none';
            document.getElementById('room-selection').style.display = 'none';
            document.getElementById('chat-header').style.display = 'flex';
            document.getElementById('chat').style.display = 'flex';
            document.getElementById('message-form').style.display = 'flex';
            document.getElementById('room-display').innerText = `Room: ${room}`;
            document.getElementById('chat').innerHTML = `<p class="system">Created / Joined room: ${room}</p>`;
        });

        socket.on('room-full', (msg) => {
            const errorDiv = document.getElementById('error-msg');
            errorDiv.innerText = msg;
            errorDiv.style.display = 'block';
        });

        socket.on('left-room', () => {
            currentRoom = "";
            document.getElementById('welcome-box').style.display = 'block';
            document.getElementById('room-selection').style.display = 'flex';
            document.getElementById('chat-header').style.display = 'none';
            document.getElementById('chat').style.display = 'none';
            document.getElementById('message-form').style.display = 'none';
            document.getElementById('chat').innerHTML = '';
            cancelReply();
        });

        function sendMessage() {
            const msgInput = document.getElementById('messageInput');
            const msg = msgInput.value.trim();
            if (msg && currentRoom) {
                socket.emit('send-message', { 
                    room: currentRoom, 
                    message: msg, 
                    type: 'text',
                    replyTo: activeReply 
                });
                msgInput.value = '';
                cancelReply();
            }
        }

        function setReply(text) {
            activeReply = text;
            document.getElementById('reply-bar-text').innerText = `Replying to: ${text}`;
            document.getElementById('reply-bar').style.display = 'flex';
        }

        function cancelReply() {
            activeReply = null;
            document.getElementById('reply-bar').style.display = 'none';
        }

        function handleMediaSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 200 * 1024 * 1024) {
                alert("File size exceeds 200MB limit!");
                event.target.value = '';
                return;
            }

            const reader = new FileReader();
            const isVideo = file.type.startsWith('video/');
            selectedMedia.type = isVideo ? 'video' : 'image';

            reader.onload = function(e) {
                selectedMedia.data = e.target.result;
                const container = document.getElementById('media-preview-container');
                if (isVideo) {
                    container.innerHTML = `<video src="${selectedMedia.data}" controls></video>`;
                } else {
                    container.innerHTML = `<img src="${selectedMedia.data}" alt="Preview">`;
                }
                document.getElementById('media-modal').style.display = 'flex';
            };
            reader.readAsDataURL(file);
        }

        function confirmSendMedia() {
            if (selectedMedia.data && currentRoom) {
                socket.emit('send-message', { 
                    room: currentRoom, 
                    message: selectedMedia.data, 
                    type: selectedMedia.type,
                    replyTo: activeReply 
                });
                cancelMediaPreview();
                cancelReply();
            }
        }

        function cancelMediaPreview() {
            selectedMedia = { data: null, type: null };
            document.getElementById('mediaInput').value = '';
            document.getElementById('media-modal').style.display = 'none';
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                let mimeType = 'audio/webm';
                if (!MediaRecorder.isTypeSupported(mimeType)) {
                    mimeType = 'audio/mp4'; 
                }

                mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
                audioChunks = [];
                isCancelled = false;

                mediaRecorder.ondataavailable = event => audioChunks.push(event.data);

                mediaRecorder.onstop = () => {
                    clearInterval(timerInterval);
                    stream.getTracks().forEach(track => track.stop());

                    if (!isCancelled && audioChunks.length > 0) {
                        const audioBlob = new Blob(audioChunks, { type: mimeType });
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            socket.emit('send-message', { 
                                room: currentRoom, 
                                message: e.target.result, 
                                type: 'audio',
                                replyTo: activeReply 
                            });
                            cancelReply();
                        };
                        reader.readAsDataURL(audioBlob);
                    }
                    resetRecordingUI();
                };

                mediaRecorder.start();
                secondsElapsed = 0;
                updateTimerDisplay();
                timerInterval = setInterval(() => {
                    secondsElapsed++;
                    updateTimerDisplay();
                }, 1000);

                document.getElementById('text-controls').style.display = 'none';
                document.getElementById('recording-controls').style.display = 'flex';
            } catch (err) {
                alert('Microphone access denied or not available.');
            }
        }

        function togglePause() {
            const pauseBtn = document.getElementById('pauseBtn');
            if (mediaRecorder.state === 'recording') {
                mediaRecorder.pause();
                clearInterval(timerInterval);
                pauseBtn.innerText = '▶️';
            } else if (mediaRecorder.state === 'paused') {
                mediaRecorder.resume();
                timerInterval = setInterval(() => {
                    secondsElapsed++;
                    updateTimerDisplay();
                }, 1000);
                pauseBtn.innerText = '⏸️';
            }
        }

        function cancelRecording() {
            isCancelled = true;
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        }

        function stopAndSendRecording() {
            isCancelled = false;
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        }

        function updateTimerDisplay() {
            const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
            const secs = (secondsElapsed % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${mins}:${secs}`;
        }

        function resetRecordingUI() {
            document.getElementById('recording-controls').style.display = 'none';
            document.getElementById('text-controls').style.display = 'flex';
            document.getElementById('pauseBtn').innerText = '⏸️';
            document.getElementById('timer').innerText = '00:00';
        }

        async function startCall() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                createPeerConnection();
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                socket.emit('call-user', { offer, room: currentRoom });
                showCallUI();
                await getAudioOutputDevices();
            } catch (err) {
                alert('Could not access microphone.');
            }
        }

        socket.on('call-made', async (data) => {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                createPeerConnection();
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                socket.emit('make-answer', { answer, room: currentRoom });
                showCallUI();
                await getAudioOutputDevices();
            } catch (err) {
                alert('Could not access microphone.');
            }
        });

        socket.on('answer-made', async (data) => {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        });

        socket.on('ice-candidate', (candidate) => {
            if (peerConnection) {
                peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
            }
        });

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(config);

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', { candidate: event.candidate, room: currentRoom });
                }
            };

            peerConnection.ontrack = (event) => {
                remoteAudio.srcObject = event.streams[0];
            };
        }

        function toggleMute() {
            if (localStream) {
                const audioTrack = localStream.getAudioTracks()[0];
                audioTrack.enabled = !audioTrack.enabled;
                muteBtn.innerText = audioTrack.enabled ? '🎤 Mute' : '🔇 Unmute';
            }
        }

        async function getAudioOutputDevices() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                audioDevices = devices.filter(device => device.kind === 'audiooutput');
                if (audioDevices.length > 0 && typeof remoteAudio.setSinkId !== 'function') {
                    console.warn('setSinkId not supported on this browser.');
                }
            } catch (err) {
                console.error('Error enumerating devices:', err);
            }
        }

        async function toggleAudioOutput() {
            if (audioDevices.length === 0) return;
            
            currentDeviceIndex = (currentDeviceIndex + 1) % audioDevices.length;
            const selectedDevice = audioDevices[currentDeviceIndex];

            if (typeof remoteAudio.setSinkId === 'function') {
                try {
                    await remoteAudio.setSinkId(selectedDevice.deviceId);
                    speakerBtn.title = `Output: ${selectedDevice.label}`;
                    speakerBtn.style.color = '#10b981'; // Green indicator when switched
                } catch (err) {
                    console.error('Error setting sink ID:', err);
                }
            }
        }

        function endCall() {
            socket.emit('end-call', { room: currentRoom });
            closeCall();
        }

        socket.on('call-ended', () => {
            closeCall();
        });

        function closeCall() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            resetCallUI();
        }

        function showCallUI() {
            startCallBtn.style.display = 'none';
            muteBtn.style.display = 'inline-block';
            speakerBtn.style.display = 'inline-block';
            endCallBtn.style.display = 'inline-block';
        }

        function resetCallUI() {
            startCallBtn.style.display = 'inline-block';
            muteBtn.style.display = 'none';
            speakerBtn.style.display = 'none';
            endCallBtn.style.display = 'none';
            muteBtn.innerText = '🎤 Mute';
            speakerBtn.style.color = '#fff';
        }

        socket.on('receive-message', (data) => {
            const chat = document.getElementById('chat');
            const messageClass = (data.sender === socket.id) ? 'sent' : (data.sender === 'System' ? 'system' : 'received');
            const senderLabel = (data.sender === 'System') ? '' : (data.sender === socket.id ? 'You: ' : 'User: ');
            
            if (data.sender === 'System') {
                chat.innerHTML += `<p class="system">${data.text}</p>`;
            } else {
                let content = '';
                let replyBox = '';

                if (data.replyTo) {
                    replyBox = `<div class="reply-box">↩ <b>${escapeHtml(data.replyTo)}</b></div>`;
                }

                if (data.type === 'image') {
                    content = `<img src="${data.text}" alt="Image">`;
                } else if (data.type === 'video') {
                    content = `<video src="${data.text}" controls></video>`;
                } else if (data.type === 'audio') {
                    content = `<audio controls src="${data.text}"></audio>`;
                } else {
                    content = escapeHtml(data.text);
                }

                const replyText = data.type === 'text' ? data.text : (data.type.toUpperCase() + ' Media');
                const replyAction = `<br><span class="reply-btn" onclick="setReply('${escapeHtml(replyText)}')">Reply</span>`;

                chat.innerHTML += `<div class="message ${messageClass}">${replyBox}<strong>${senderLabel}</strong>${content}${replyAction}</div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        });

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
