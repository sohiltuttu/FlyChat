<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlyChat</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b0f19; color: #e0e6ed; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        h2 { text-align: center; color: #4da6ff; margin-bottom: 20px; }
        
        .welcome-card {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .welcome-card h3 { color: #60a5fa; margin-top: 0; margin-bottom: 8px; font-size: 18px; }
        .welcome-card p { color: #9ca3af; font-size: 14px; margin: 0; line-height: 1.5; }

        #warning-msg { color: #f59e0b; text-align: center; margin-bottom: 10px; display: none; font-size: 14px; }
        #error-msg { color: #ef4444; text-align: center; margin-bottom: 15px; display: none; font-size: 14px; font-weight: bold; padding: 10px; background-color: #7f1d1d; border-radius: 6px; border: 1px solid #b91c1c; }
        
        #room-selection { display: flex; justify-content: center; background-color: #111827; padding: 20px; border-radius: 8px; border: 1px solid #1f2937; margin-bottom: 15px; }
        #roomInput { padding: 12px; border: 1px solid #374151; border-radius: 6px; background-color: #1f2937; color: #fff; margin-right: 10px; width: 200px; outline: none; }

        button { padding: 10px 14px; border: none; border-radius: 6px; background-color: #2563eb; color: #fff; cursor: pointer; font-weight: bold; transition: background 0.2s; margin-left: 4px; }
        button:hover { background-color: #1d4ed8; }
        .btn-danger { background-color: #dc2626; }
        .btn-danger:hover { background-color: #b91c1c; }
        .btn-icon { background-color: #374151; }
        .btn-icon:hover { background-color: #4b5563; }

        #chat-header { display: none; justify-content: space-between; align-items: center; background-color: #111827; padding: 10px 15px; border-radius: 8px 8px 0 0; border-bottom: 1px solid #1f2937; }
        #chat { border: 1px solid #1f2937; height: 400px; overflow-y: auto; padding: 20px; border-radius: 0 0 8px 8px; background-color: #111827; margin-bottom: 15px; display: flex; flex-direction: column; }
        .message { margin-bottom: 12px; padding: 10px 16px; border-radius: 18px; max-width: 70%; word-wrap: break-word; font-size: 15px; }
        .message img { max-width: 100%; border-radius: 8px; margin-top: 5px; display: block; }
        .message audio { max-width: 100%; margin-top: 5px; display: block; }
        .sent { background-color: #2563eb; color: #ffffff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .received { background-color: #1f2937; color: #e0e6ed; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #374151; }
        .system { color: #9ca3af; text-align: center; font-style: italic; align-self: center; font-size: 13px; margin: 8px 0; }
        
        #message-form { display: none; justify-content: space-between; align-items: center; background-color: #111827; padding: 10px; border-radius: 8px; border: 1px solid #1f2937; }
        #messageInput { flex: 1; padding: 12px; border: 1px solid #374151; border-radius: 6px; background-color: #1f2937; color: #fff; outline: none; }

        #recording-controls { display: none; align-items: center; gap: 8px; flex: 1; }
        #timer { color: #ef4444; font-weight: bold; font-family: monospace; font-size: 16px; margin: 0 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>FlyChat</h2>
        
        <div class="welcome-card" id="welcome-box">
            <h3>Welcome to FlyChat 💬</h3>
            <p>Enter a unique room code below to create or join a chat room.</p>
        </div>

        <div id="room-selection">
            <input type="text" id="roomInput" placeholder="Enter Room Code">
            <button onclick="joinRoom()">Join / Create</button>
        </div>

        <div id="warning-msg"></div>
        <div id="error-msg"></div>

        <div id="chat-header">
            <span id="room-display" style="font-weight: bold; color: #60a5fa;"></span>
            <button class="btn-danger" onclick="leaveRoom()">Exit Room</button>
        </div>

        <div id="chat" style="display: none;"></div>

        <div id="message-form">
            <div id="text-controls" style="display: flex; flex: 1; align-items: center;">
                <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
                <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="sendImage()">
                <button class="btn-icon" onclick="document.getElementById('imageInput').click()" title="Send Image">📷</button>
                <button class="btn-icon" onclick="startRecording()" title="Record Voice">🎤</button>
                <button onclick="sendMessage()">Send</button>
            </div>

            <div id="recording-controls">
                <span id="timer">00:00</span>
                <button class="btn-icon" id="pauseBtn" onclick="togglePause()" title="Pause/Resume">⏸️</button>
                <button class="btn-danger" onclick="cancelRecording()" title="Cancel Recording">🗑️ Cancel</button>
                <button style="background-color: #10b981;" onclick="stopAndSendRecording()" title="Send Voice">📤 Send Voice</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentRoom = "";
        let mediaRecorder;
        let audioChunks = [];
        let timerInterval;
        let secondsElapsed = 0;
        let isCancelled = false;

        function joinRoom() {
            const roomCode = document.getElementById('roomInput').value.trim();
            const errorDiv = document.getElementById('error-msg');
            const warningDiv = document.getElementById('warning-msg');
            
            errorDiv.style.display = 'none';
            warningDiv.style.display = 'none';

            if (!roomCode) return;

            currentRoom = roomCode;
            socket.emit('join-room', currentRoom);
        }

        function leaveRoom() {
            if (currentRoom) socket.emit('leave-room', currentRoom);
        }

        socket.on('joined', (room) => {
            document.getElementById('welcome-box').style.display = 'none';
            document.getElementById('room-selection').style.display = 'none';
            document.getElementById('chat-header').style.display = 'flex';
            document.getElementById('chat').style.display = 'flex';
            document.getElementById('message-form').style.display = 'flex';
            document.getElementById('room-display').innerText = `Room: ${room}`;
            document.getElementById('chat').innerHTML = `<p class="system">Created / Joined room: ${room}</p>`;
        });

        socket.on('room-full', (msg) => {
            const errorDiv = document.getElementById('error-msg');
            errorDiv.innerText = msg;
            errorDiv.style.display = 'block';
        });

        socket.on('left-room', () => {
            currentRoom = "";
            document.getElementById('welcome-box').style.display = 'block';
            document.getElementById('room-selection').style.display = 'flex';
            document.getElementById('chat-header').style.display = 'none';
            document.getElementById('chat').style.display = 'none';
            document.getElementById('message-form').style.display = 'none';
            document.getElementById('chat').innerHTML = '';
        });

        function sendMessage() {
            const msgInput = document.getElementById('messageInput');
            const msg = msgInput.value.trim();
            if (msg && currentRoom) {
                socket.emit('send-message', { room: currentRoom, message: msg, type: 'text' });
                msgInput.value = '';
            }
        }

        function sendImage() {
            const fileInput = document.getElementById('imageInput');
            const file = fileInput.files[0];
            if (file && currentRoom) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    socket.emit('send-message', { room: currentRoom, message: e.target.result, type: 'image' });
                    fileInput.value = '';
                };
                reader.readAsDataURL(file);
            }
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                isCancelled = false;

                mediaRecorder.ondataavailable = event => audioChunks.push(event.data);

                mediaRecorder.onstop = () => {
                    clearInterval(timerInterval);
                    stream.getTracks().forEach(track => track.stop());

                    if (!isCancelled && audioChunks.length > 0) {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            socket.emit('send-message', { room: currentRoom, message: e.target.result, type: 'audio' });
                        };
                        reader.readAsDataURL(audioBlob);
                    }
                    resetRecordingUI();
                };

                mediaRecorder.start();
                secondsElapsed = 0;
                updateTimerDisplay();
                timerInterval = setInterval(() => {
                    secondsElapsed++;
                    updateTimerDisplay();
                }, 1000);

                document.getElementById('text-controls').style.display = 'none';
                document.getElementById('recording-controls').style.display = 'flex';
            } catch (err) {
                alert('Microphone access denied or not available.');
            }
        }

        function togglePause() {
            const pauseBtn = document.getElementById('pauseBtn');
            if (mediaRecorder.state === 'recording') {
                mediaRecorder.pause();
                clearInterval(timerInterval);
                pauseBtn.innerText = '▶️';
            } else if (mediaRecorder.state === 'paused') {
                mediaRecorder.resume();
                timerInterval = setInterval(() => {
                    secondsElapsed++;
                    updateTimerDisplay();
                }, 1000);
                pauseBtn.innerText = '⏸️';
            }
        }

        function cancelRecording() {
            isCancelled = true;
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        }

        function stopAndSendRecording() {
            isCancelled = false;
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        }

        function updateTimerDisplay() {
            const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
            const secs = (secondsElapsed % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${mins}:${secs}`;
        }

        function resetRecordingUI() {
            document.getElementById('recording-controls').style.display = 'none';
            document.getElementById('text-controls').style.display = 'flex';
            document.getElementById('pauseBtn').innerText = '⏸️';
            document.getElementById('timer').innerText = '00:00';
        }

        socket.on('receive-message', (data) => {
            const chat = document.getElementById('chat');
            const messageClass = (data.sender === socket.id) ? 'sent' : (data.sender === 'System' ? 'system' : 'received');
            const senderLabel = (data.sender === 'System') ? '' : (data.sender === socket.id ? 'You: ' : 'User: ');
            
            if (data.sender === 'System') {
                chat.innerHTML += `<p class="system">${data.text}</p>`;
            } else {
                let content = '';
                if (data.type === 'image') {
                    content = `<img src="${data.text}" alt="Image">`;
                } else if (data.type === 'audio') {
                    content = `<audio controls src="${data.text}"></audio>`;
                } else {
                    content = data.text;
                }
                chat.innerHTML += `<div class="message ${messageClass}"><strong>${senderLabel}</strong>${content}</div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        });
    </script>
</body>
</html>
