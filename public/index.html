<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FlyChat</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --success-color: #10b981;
            --warning-color: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            max-height: 95vh;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
            transition: height 0.2s ease-out;
        }

        h2 {
            text-align: center;
            color: var(--accent-color);
            font-size: 24px;
            font-weight: 700;
        }

        .welcome-card {
            text-align: center;
            padding: 12px;
            background-color: rgba(59, 130, 246, 0.08);
            border-radius: 12px;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .welcome-card h3 {
            color: var(--accent-color);
            margin-bottom: 4px;
            font-size: 16px;
        }

        .welcome-card p {
            color: var(--text-secondary);
            font-size: 13px;
        }

        #warning-msg, #error-msg {
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            display: none;
            padding: 8px 12px;
            border-radius: 8px;
            line-height: 1.4;
            transition: all 0.2s ease;
        }

        #error-msg {
            color: #fca5a5;
            background-color: rgba(239, 68, 68, 0.2);
            border: 1px solid var(--danger-color);
        }

        #room-selection {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            background-color: rgba(255, 255, 255, 0.02);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        /* Prevent Auto-Zoom on iOS */
        input[type="text"], input[type="file"], button {
            font-size: 16px !important;
        }

        #roomInput {
            flex: 1;
            min-width: 140px;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background-color: var(--bg-color);
            color: #fff;
            outline: none;
            transition: border-color 0.2s ease;
        }

        #roomInput:focus {
            border-color: var(--accent-color);
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 10px;
            background-color: var(--accent-color);
            color: #fff;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-danger { background-color: var(--danger-color); }
        .btn-icon { background-color: var(--border-color); color: var(--text-primary); padding: 10px; }

        #chat-header {
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        #call-controls {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        #chat {
            border: 1px solid var(--border-color);
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            border-radius: 12px;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }

        /* Smooth Message Animation */
        @keyframes messagePop {
            0% {
                opacity: 0;
                transform: translateY(12px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .message {
            padding: 8px 12px;
            border-radius: 14px;
            max-width: 85%;
            word-break: break-word;
            font-size: 14px;
            line-height: 1.4;
            animation: messagePop 0.25s ease-out forwards;
        }

        .sent {
            background-color: var(--accent-color);
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .received {
            background-color: var(--border-color);
            color: var(--text-primary);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .system {
            color: var(--text-secondary);
            text-align: center;
            font-style: italic;
            align-self: center;
            font-size: 12px;
            animation: messagePop 0.2s ease-out forwards;
        }

        .message img, .message video {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 4px;
        }

        .reply-box {
            background: rgba(0, 0, 0, 0.25);
            border-left: 3px solid #fff;
            padding: 4px 6px;
            font-size: 11px;
            margin-bottom: 4px;
            border-radius: 4px;
        }

        .reply-btn {
            font-size: 10px;
            opacity: 0.8;
            cursor: pointer;
            margin-top: 4px;
            display: inline-block;
            text-decoration: underline;
        }

        #reply-bar {
            display: none;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 8px;
            margin-bottom: 6px;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        #message-form {
            display: none;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        #input-row {
            display: flex;
            gap: 6px;
            align-items: center;
            width: 100%;
        }

        #text-controls {
            display: flex;
            flex: 1;
            gap: 6px;
            align-items: center;
            width: 100%;
            min-width: 0;
        }

        #messageInput {
            flex: 1;
            min-width: 0;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background-color: var(--bg-color);
            color: #fff;
            outline: none;
        }

        #recording-controls {
            display: none;
            align-items: center;
            gap: 6px;
            flex: 1;
        }

        #timer {
            color: var(--danger-color);
            font-weight: bold;
            font-family: monospace;
            font-size: 15px;
        }

        /* Modals */
        #media-modal, .call-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 16px;
        }

        .call-modal {
            height: auto;
            top: 20px; right: 20px; left: auto;
            width: calc(100% - 40px);
            max-width: 300px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        @media (max-width: 480px) {
            body { padding: 0; }
            .container { padding: 10px; border-radius: 0; border: none; max-height: 100vh; }
            #chat-header { flex-direction: row; }
            button { padding: 8px 12px; }
            .btn-icon { padding: 8px 10px; }
        }
    </style>
</head>
<body>
    <div class="container" id="main-container">
        <div id="setup-section">
            <h2>FlyChat</h2>
            <br>
            <div class="welcome-card" id="welcome-box">
                <h3>Welcome to FlyChat</h3>
                <p>Simple, secure real-time chat & call.</p>
            </div>
            <br>
            <div id="warning-msg"></div>
            <div id="error-msg"></div>

            <div id="room-selection">
                <input type="text" id="roomInput" placeholder="Enter Room Code">
                <button onclick="joinRoom()">Join / Create</button>
            </div>
        </div>

        <div id="chat-header">
            <span id="room-display" style="font-weight: bold; color: var(--accent-color); font-size: 14px;"></span>
            <div id="call-controls">
                <button id="start-call-btn" onclick="initiateCall()">📞 Call</button>
                <button id="mute-btn" class="btn-icon" onclick="toggleMute()" style="display:none;">🎤 Mute</button>
                <button id="speaker-btn" class="btn-icon" onclick="toggleAudioOutput()" style="display:none;">🔊</button>
                <button id="end-call-btn" class="btn-danger" onclick="endCall()" style="display:none;">Hang Up</button>
                <button class="btn-danger" onclick="leaveRoom()">Exit</button>
            </div>
        </div>

        <div id="chat" style="display: none;"></div>

        <div id="message-form">
            <div id="reply-bar">
                <span id="reply-bar-text">Replying...</span>
                <button onclick="cancelReply()" style="background: transparent; color: var(--danger-color); padding: 0 4px;">✕</button>
            </div>

            <div id="input-row">
                <div id="text-controls">
                    <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;" onchange="handleMediaSelect(event)">
                    <button class="btn-icon" onclick="document.getElementById('mediaInput').click()" title="Send Media">📁</button>
                    <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
                    <button class="btn-icon" onclick="startRecording()" title="Voice Record">🎤</button>
                    <button onclick="sendMessage()">Send</button>
                </div>

                <div id="recording-controls">
                    <span id="timer">00:00</span>
                    <button class="btn-icon" id="pauseBtn" onclick="togglePause()">⏸️</button>
                    <button class="btn-danger btn-icon" onclick="cancelRecording()">🗑️</button>
                    <button style="background-color: var(--success-color);" onclick="stopAndSendRecording()">📤 Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Media Preview Modal -->
    <div id="media-modal">
        <div id="media-preview-container" style="max-width: 90%; max-height: 60vh; margin-bottom: 12px;"></div>
        <div style="display: flex; gap: 10px;">
            <button style="background-color: var(--success-color);" onclick="confirmSendMedia()">Send</button>
            <button class="btn-danger" onclick="cancelMediaPreview()">Cancel</button>
        </div>
    </div>

    <!-- Incoming Call Modal -->
    <div id="incoming-call-modal" class="call-modal">
        <p style="margin-bottom: 12px; text-align: center; font-size: 14px;">📞 Incoming Voice Call...</p>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button style="background-color: var(--success-color);" onclick="acceptCall()">Accept</button>
            <button class="btn-danger" onclick="rejectCall()">Decline</button>
        </div>
    </div>

    <!-- Outgoing Call Modal -->
    <div id="outgoing-call-modal" class="call-modal">
        <p style="margin-bottom: 12px; text-align: center; font-size: 14px;">Calling...</p>
        <div style="display: flex; justify-content: center;">
            <button class="btn-danger" onclick="cancelOutgoingCall()">Cancel</button>
        </div>
    </div>

    <audio id="remote-audio" autoplay></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // iOS Visual Viewport Keyboard Adjustment
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                const mainContainer = document.getElementById('main-container');
                mainContainer.style.height = `${window.visualViewport.height}px`;
                window.scrollTo(0, 0);
                const chat = document.getElementById('chat');
                if (chat) chat.scrollTop = chat.scrollHeight;
            });
        }

        const socket = io();
        let currentRoom = "";
        let mediaRecorder;
        let audioChunks = [];
        let timerInterval;
        let secondsElapsed = 0;
        let isCancelled = false;

        let activeReply = null;
        let selectedMedia = { data: null, type: null };

        let localStream;
        let peerConnection;
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        const remoteAudio = document.getElementById('remote-audio');
        const startCallBtn = document.getElementById('start-call-btn');
        const muteBtn = document.getElementById('mute-btn');
        const endCallBtn = document.getElementById('end-call-btn');
        const speakerBtn = document.getElementById('speaker-btn');

        const roomInput = document.getElementById('roomInput');
        const warningMsg = document.getElementById('warning-msg');

        // Dynamic Real-Time Security & Strength Evaluator
        roomInput.addEventListener('input', () => {
            const val = roomInput.value.trim();

            if (val.length === 0) {
                warningMsg.style.display = 'none';
                return;
            }

            const hasLetters = /[a-zA-Z]/.test(val);
            const hasNumbers = /[0-9]/.test(val);
            const hasSpecials = /[^a-zA-Z0-9]/.test(val);

            warningMsg.style.display = 'block';

            // High Security: Special Characters + (Letters OR Numbers)
            if (hasSpecials && (hasLetters || hasNumbers)) {
                warningMsg.innerText = "🔒 Highly Secure Code! Your chat is safe.";
                warningMsg.style.color = '#34d399';
                warningMsg.style.backgroundColor = 'rgba(16, 185, 129, 0.15)';
                warningMsg.style.border = '1px solid var(--success-color)';
            }
            // Moderate Security: Numbers + Letters mixed
            else if (hasLetters && hasNumbers) {
                warningMsg.innerText = "⚡ Moderate Security! Consider adding special characters (@, #, $).";
                warningMsg.style.color = '#fbbf24';
                warningMsg.style.backgroundColor = 'rgba(245, 158, 11, 0.15)';
                warningMsg.style.border = '1px solid var(--warning-color)';
            }
            // Weak/Insecure Security: Just letters (like abcd) or just numbers
            else {
                warningMsg.innerText = "⚠️ Insecure Code! Someone else might easily guess or join your room. Use a stronger code.";
                warningMsg.style.color = '#f87171';
                warningMsg.style.backgroundColor = 'rgba(239, 68, 68, 0.15)';
                warningMsg.style.border = '1px solid var(--danger-color)';
            }
        });

        function joinRoom() {
            const roomCode = roomInput.value.trim();
            if (!roomCode) return;
            currentRoom = roomCode;
            socket.emit('join-room', currentRoom);
        }

        function leaveRoom() {
            if (currentRoom) {
                endCall();
                socket.emit('leave-room', currentRoom);
            }
        }

        socket.on('joined', (room) => {
            document.getElementById('setup-section').style.display = 'none';
            document.getElementById('chat-header').style.display = 'flex';
            document.getElementById('chat').style.display = 'flex';
            document.getElementById('message-form').style.display = 'flex';
            document.getElementById('room-display').innerText = `Room: ${room}`;
            
            const chat = document.getElementById('chat');
            chat.innerHTML = '';
            const sysMsg = document.createElement('p');
            sysMsg.className = 'system';
            sysMsg.innerText = `Joined room: ${room}`;
            chat.appendChild(sysMsg);
        });

        socket.on('room-full', (msg) => {
            const errorDiv = document.getElementById('error-msg');
            errorDiv.innerText = msg;
            errorDiv.style.display = 'block';
        });

        socket.on('left-room', () => {
            currentRoom = "";
            document.getElementById('setup-section').style.display = 'block';
            document.getElementById('chat-header').style.display = 'none';
            document.getElementById('chat').style.display = 'none';
            document.getElementById('message-form').style.display = 'none';
            document.getElementById('chat').innerHTML = '';
            cancelReply();
            endCall();
        });

        function sendMessage() {
            const msgInput = document.getElementById('messageInput');
            const msg = msgInput.value.trim();
            if (msg && currentRoom) {
                socket.emit('send-message', { 
                    room: currentRoom, 
                    message: msg, 
                    type: 'text',
                    replyTo: activeReply 
                });
                msgInput.value = '';
                cancelReply();
            }
        }

        function setReply(text) {
            activeReply = text;
            document.getElementById('reply-bar-text').innerText = `Replying to: ${text}`;
            document.getElementById('reply-bar').style.display = 'flex';
        }

        function cancelReply() {
            activeReply = null;
            document.getElementById('reply-bar').style.display = 'none';
        }

        function handleMediaSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 200 * 1024 * 1024) {
                alert("File size exceeds 200MB limit!");
                event.target.value = '';
                return;
            }

            const reader = new FileReader();
            const isVideo = file.type.startsWith('video/');
            selectedMedia.type = isVideo ? 'video' : 'image';

            reader.onload = function(e) {
                selectedMedia.data = e.target.result;
                const container = document.getElementById('media-preview-container');
                container.innerHTML = isVideo ? `<video src="${selectedMedia.data}" controls style="max-width:100%;"></video>` : `<img src="${selectedMedia.data}" style="max-width:100%;">`;
                document.getElementById('media-modal').style.display = 'flex';
            };
            reader.readAsDataURL(file);
        }

        function confirmSendMedia() {
            if (selectedMedia.data && currentRoom) {
                socket.emit('send-message', { 
                    room: currentRoom, 
                    message: selectedMedia.data, 
                    type: selectedMedia.type,
                    replyTo: activeReply 
                });
                cancelMediaPreview();
                cancelReply();
            }
        }

        function cancelMediaPreview() {
            selectedMedia = { data: null, type: null };
            document.getElementById('mediaInput').value = '';
            document.getElementById('media-modal').style.display = 'none';
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                let mimeType = 'audio/webm';
                if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'audio/mp4';

                mediaRecorder = new MediaRecorder(stream, { mimeType });
                audioChunks = [];
                isCancelled = false;

                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    clearInterval(timerInterval);
                    stream.getTracks().forEach(t => t.stop());

                    if (!isCancelled && audioChunks.length > 0) {
                        const audioBlob = new Blob(audioChunks, { type: mimeType });
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            socket.emit('send-message', { 
                                room: currentRoom, 
                                message: e.target.result, 
                                type: 'audio',
                                replyTo: activeReply 
                            });
                            cancelReply();
                        };
                        reader.readAsDataURL(audioBlob);
                    }
                    resetRecordingUI();
                };

                mediaRecorder.start();
                secondsElapsed = 0;
                updateTimerDisplay();
                timerInterval = setInterval(() => { secondsElapsed++; updateTimerDisplay(); }, 1000);

                document.getElementById('text-controls').style.display = 'none';
                document.getElementById('recording-controls').style.display = 'flex';
            } catch (err) {
                alert('Microphone access denied.');
            }
        }

        function togglePause() {
            const pauseBtn = document.getElementById('pauseBtn');
            if (mediaRecorder.state === 'recording') {
                mediaRecorder.pause();
                clearInterval(timerInterval);
                pauseBtn.innerText = '▶️';
            } else if (mediaRecorder.state === 'paused') {
                mediaRecorder.resume();
                timerInterval = setInterval(() => { secondsElapsed++; updateTimerDisplay(); }, 1000);
                pauseBtn.innerText = '⏸️';
            }
        }

        function cancelRecording() {
            isCancelled = true;
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        }

        function stopAndSendRecording() {
            isCancelled = false;
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        }

        function updateTimerDisplay() {
            const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
            const secs = (secondsElapsed % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${mins}:${secs}`;
        }

        function resetRecordingUI() {
            document.getElementById('recording-controls').style.display = 'none';
            document.getElementById('text-controls').style.display = 'flex';
            document.getElementById('pauseBtn').innerText = '⏸️';
            document.getElementById('timer').innerText = '00:00';
        }

        function initiateCall() {
            document.getElementById('outgoing-call-modal').style.display = 'flex';
            socket.emit('request-call', { room: currentRoom });
        }

        socket.on('incoming-call', () => {
            document.getElementById('incoming-call-modal').style.display = 'flex';
        });

        async function acceptCall() {
            document.getElementById('incoming-call-modal').style.display = 'none';
            socket.emit('accept-call', { room: currentRoom });
            await setupLocalMediaAndConnection();
        }

        function rejectCall() {
            document.getElementById('incoming-call-modal').style.display = 'none';
            socket.emit('reject-call', { room: currentRoom });
        }

        function cancelOutgoingCall() {
            document.getElementById('outgoing-call-modal').style.display = 'none';
            socket.emit('reject-call', { room: currentRoom });
        }

        socket.on('call-accepted', async () => {
            document.getElementById('outgoing-call-modal').style.display = 'none';
            await setupLocalMediaAndConnection();
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('call-user', { offer, room: currentRoom });
        });

        socket.on('call-rejected', () => {
            document.getElementById('outgoing-call-modal').style.display = 'none';
            alert("Call declined.");
        });

        async function setupLocalMediaAndConnection() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                createPeerConnection();
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
                showCallUI();
            } catch (err) {
                alert('Could not access mic.');
            }
        }

        socket.on('call-made', async (data) => {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('make-answer', { answer, room: currentRoom });
        });

        socket.on('answer-made', async (data) => {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        });

        socket.on('ice-candidate', (candidate) => {
            if (peerConnection) peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
        });

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(config);
            peerConnection.onicecandidate = e => {
                if (e.candidate) socket.emit('ice-candidate', { candidate: e.candidate, room: currentRoom });
            };
            peerConnection.ontrack = e => remoteAudio.srcObject = e.streams[0];
        }

        function toggleMute() {
            if (localStream) {
                const track = localStream.getAudioTracks()[0];
                track.enabled = !track.enabled;
                muteBtn.innerText = track.enabled ? '🎤 Mute' : '🔇 Unmute';
            }
        }

        function endCall() {
            socket.emit('end-call', { room: currentRoom });
            closeCall();
        }

        socket.on('call-ended', closeCall);

        function closeCall() {
            if (peerConnection) { peerConnection.close(); peerConnection = null; }
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
            resetCallUI();
        }

        function showCallUI() {
            startCallBtn.style.display = 'none';
            muteBtn.style.display = 'inline-flex';
            speakerBtn.style.display = 'inline-flex';
            endCallBtn.style.display = 'inline-flex';
        }

        function resetCallUI() {
            startCallBtn.style.display = 'inline-flex';
            muteBtn.style.display = 'none';
            speakerBtn.style.display = 'none';
            endCallBtn.style.display = 'none';
        }

        socket.on('receive-message', (data) => {
            const chat = document.getElementById('chat');
            if (data.sender === 'System') {
                const sysMsg = document.createElement('p');
                sysMsg.className = 'system';
                sysMsg.innerText = data.text;
                chat.appendChild(sysMsg);
            } else {
                const isSent = (data.sender === socket.id);
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${isSent ? 'sent' : 'received'}`;

                let contentHtml = '';
                let replyBoxHtml = data.replyTo ? `<div class="reply-box">↩ ${escapeHtml(data.replyTo)}</div>` : '';

                if (data.type === 'image') contentHtml = `<img src="${data.text}">`;
                else if (data.type === 'video') contentHtml = `<video src="${data.text}" controls></video>`;
                else if (data.type === 'audio') contentHtml = `<audio controls src="${data.text}"></audio>`;
                else contentHtml = escapeHtml(data.text);

                msgDiv.innerHTML = `${replyBoxHtml}<strong>${isSent ? 'You: ' : 'User: '}</strong>${contentHtml}<br><span class="reply-btn">Reply</span>`;

                msgDiv.querySelector('.reply-btn').addEventListener('click', () => {
                    setReply(data.type === 'text' ? data.text : data.type.toUpperCase());
                });

                chat.appendChild(msgDiv);
            }
            chat.scrollTop = chat.scrollHeight;
        });

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
