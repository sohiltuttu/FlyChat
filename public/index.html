<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlyChat</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: #1f2937;
            --text-primary: #e0e6ed;
            --text-secondary: #9ca3af;
            --accent-color: #4da6ff;
            --accent-hover: #2563eb;
            --danger-color: #dc2626;
            --danger-hover: #991b1b;
            --success-color: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.5s ease-out;
            box-sizing: border-box;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 25px;
            font-size: 28px;
            font-weight: 700;
        }

        .welcome-card {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            background-color: rgba(77, 166, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(77, 166, 255, 0.1);
        }

        .welcome-card h3 {
            color: var(--accent-color);
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 22px;
        }

        .welcome-card p {
            color: var(--text-secondary);
            font-size: 14px;
            margin: 0;
            line-height: 1.6;
        }

        #warning-msg {
            text-align: center;
            margin-bottom: 10px;
            display: none;
            font-size: 14px;
            font-weight: bold;
        }

        #error-msg {
            color: #ef4444;
            text-align: center;
            margin-bottom: 15px;
            display: none;
            font-size: 14px;
            font-weight: bold;
            padding: 10px;
            background-color: #7f1d1d;
            border-radius: 6px;
            border: 1px solid #b91c1c;
        }

        #room-selection {
            display: flex;
            justify-content: center;
            background-color: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        #roomInput {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--bg-color);
            color: #fff;
            margin-right: 10px;
            width: 220px;
            outline: none;
            transition: border 0.2s;
        }

        #roomInput:focus {
            border-color: var(--accent-color);
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background-color: var(--accent-color);
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-danger {
            background-color: var(--danger-color);
        }
        .btn-danger:hover {
            background-color: var(--danger-hover);
        }
        .btn-icon {
            background-color: var(--border-color);
            color: var(--text-primary);
            padding: 10px;
        }
        .btn-icon:hover {
            background-color: #374151;
        }

        #chat-header {
            display: none;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 15px 20px;
            border-radius: 8px 8px 0 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 0;
            width: 100%;
            box-sizing: border-box;
        }

        #chat {
            border: 1px solid var(--border-color);
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            border-radius: 0 0 8px 8px;
            background-color: var(--card-bg);
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            width: 100%;
            box-sizing: border-box;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 75%;
            word-wrap: break-word;
            font-size: 15px;
            position: relative;
        }

        .new-message {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message img, .message video {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
            display: block;
        }
        .message audio {
            max-width: 100%;
            margin-top: 8px;
            display: block;
        }
        .sent {
            background-color: var(--accent-color);
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .received {
            background-color: var(--border-color);
            color: var(--text-primary);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .system {
            color: var(--text-secondary);
            text-align: center;
            font-style: italic;
            align-self: center;
            font-size: 13px;
            margin: 10px 0;
        }

        .reply-box {
            background: rgba(0, 0, 0, 0.2);
            border-left: 3px solid var(--accent-color);
            padding: 6px 10px;
            font-size: 12px;
            margin-bottom: 8px;
            border-radius: 4px;
            color: var(--text-secondary);
        }
        .reply-btn {
            font-size: 11px;
            opacity: 0.8;
            cursor: pointer;
            margin-top: 6px;
            display: inline-block;
            text-decoration: underline;
        }
        .sent .reply-btn {
            color: #ffffff;
        }
        .received .reply-btn {
            color: var(--accent-color);
        }
        .reply-btn:hover {
            opacity: 1;
        }

        #reply-bar {
            display: none;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            width: 100%;
            box-sizing: border-box;
        }
        #reply-bar-text {
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80%;
        }

        #message-form {
            display: none;
            flex-direction: column;
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            width: 100%;
            box-sizing: border-box;
        }
        #input-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 8px;
        }
        #messageInput {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--bg-color);
            color: #fff;
            outline: none;
            transition: border 0.2s;
        }
        #messageInput:focus {
            border-color: var(--accent-color);
        }

        #recording-controls {
            display: none;
            align-items: center;
            gap: 10px;
            flex: 1;
        }
        #timer {
            color: var(--danger-color);
            font-weight: bold;
            font-family: monospace;
            font-size: 16px;
            margin: 0 10px;
        }

        #media-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        #media-preview-container {
            max-width: 90%;
            max-height: 70%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }
        #media-preview-container img, #media-preview-container video {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
            object-fit: contain;
        }

        .call-modal {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            z-index: 3000;
            color: var(--text-primary);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            animation: slideIn 0.3s ease-out;
            width: 300px;
            box-sizing: border-box;
        }
        .call-modal p {
            margin: 0 0 15px 0;
            font-size: 16px;
            text-align: center;
        }
        .call-modal .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        #call-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="setup-section">
            <h2>FlyChat</h2>
            
            <div class="welcome-card" id="welcome-box">
                <h3>Welcome to FlyChat</h3>
                <p>Simple, secure, and professional real-time communication. Connect and collaborate instantly.</p>
            </div>

            <div id="warning-msg"></div>
            <div id="error-msg"></div>

            <div id="room-selection">
                <input type="text" id="roomInput" placeholder="Enter Room Code">
                <button onclick="joinRoom()">Join / Create</button>
            </div>
        </div>

        <div id="chat-header">
            <span id="room-display" style="font-weight: bold; color: var(--accent-color);"></span>
            <div id="call-controls">
                <button id="start-call-btn" onclick="initiateCall()">📞 Call</button>
                <button id="mute-btn" class="btn-icon" onclick="toggleMute()" style="display:none;">🎤 Mute</button>
                <button id="speaker-btn" class="btn-icon" onclick="toggleAudioOutput()" style="display:none;" title="Switch Audio Output">🔊</button>
                <button id="end-call-btn" class="btn-danger" onclick="endCall()" style="display:none;">Hang Up</button>
            </div>
            <button class="btn-danger" onclick="leaveRoom()">Exit</button>
        </div>

        <div id="chat" style="display: none;"></div>

        <div id="message-form">
            <div id="reply-bar">
                <span id="reply-bar-text">Replying to...</span>
                <button onclick="cancelReply()" style="background: transparent; color: var(--danger-color); padding: 4px 8px; margin: 0;">✕</button>
            </div>

            <div id="input-row">
                <div id="text-controls" style="display: flex; flex: 1; align-items: center; gap: 8px;">
                    <!-- 1. ഫയൽ ബട്ടൺ -->
                    <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;" onchange="handleMediaSelect(event)">
                    <button class="btn-icon" onclick="document.getElementById('mediaInput').click()" title="Send Image/Video">📁</button>
                    
                    <!-- 2. ടെക്സ്റ്റ് ചാറ്റ് ബോക്സ് -->
                    <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
                    
                    <!-- 3. മൈക്ക് ബട്ടൺ -->
                    <button class="btn-icon" onclick="startRecording()" title="Record Voice">🎤</button>
                    
                    <!-- 4. സെൻഡ് ബട്ടൺ -->
                    <button onclick="sendMessage()">Send</button>
                </div>

                <div id="recording-controls">
                    <span id="timer">00:00</span>
                    <button class="btn-icon" id="pauseBtn" onclick="togglePause()" title="Pause/Resume">⏸️</button>
                    <button class="btn-danger" onclick="cancelRecording()" title="Cancel Recording">🗑️ Cancel</button>
                    <button style="background-color: var(--success-color);" onclick="stopAndSendRecording()" title="Send Voice">📤 Send Voice</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Media Preview Modal -->
    <div id="media-modal">
        <div id="media-preview-container"></div>
        <div>
            <button style="background-color: var(--success-color);" onclick="confirmSendMedia()">Send</button>
            <button class="btn-danger" onclick="cancelMediaPreview()">Cancel</button>
        </div>
    </div>

    <!-- Incoming Call Modal -->
    <div id="incoming-call-modal" class="call-modal">
        <p>📞 Incoming Voice Call...</p>
        <div class="btn-group">
            <button style="background-color: var(--success-color);" onclick="acceptCall()">Accept</button>
            <button class="btn-danger" onclick="rejectCall()">Decline</button>
        </div>
    </div>

    <!-- Outgoing Call Modal -->
    <div id="outgoing-call-modal" class="call-modal">
        <p>Calling the user...</p>
        <div class="btn-group">
            <button class="btn-danger" onclick="cancelOutgoingCall()">Cancel</button>
        </div>
    </div>

    <audio id="remote-audio" autoplay></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentRoom = "";
        let mediaRecorder;
        let audioChunks = [];
        let timerInterval;
        let secondsElapsed = 0;
        let isCancelled = false;

        let activeReply = null;
        let selectedMedia = { data: null, type: null };

        let localStream;
        let peerConnection;
        const config = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        const remoteAudio = document.getElementById('remote-audio');
        const startCallBtn = document.getElementById('start-call-btn');
        const muteBtn = document.getElementById('mute-btn');
        const endCallBtn = document.getElementById('end-call-btn');
        const speakerBtn = document.getElementById('speaker-btn');

        let audioDevices = [];
        let currentDeviceIndex = 0;

        // Security Validation On Input
        const roomInput = document.getElementById('roomInput');
        const warningMsg = document.getElementById('warning-msg');

        roomInput.addEventListener('input', () => {
            const code = roomInput.value.trim();
            const hasAlpha = /[a-zA-Z]/.test(code);
            const hasNumber = /[0-9]/.test(code);
            const hasSpecial = /[^A-Za-z0-9]/.test(code);
            const hasOnlyLetters = /^[a-zA-Z]+$/.test(code);

            if (code.length === 0) {
                warningMsg.style.display = 'none';
            } else if (hasOnlyLetters && code.length <= 4) {
                warningMsg.innerText = "⚠️ Weak (Letters only)";
                warningMsg.style.display = 'block';
                warningMsg.style.color = '#f59e0b';
            } else if (code.length >= 5 && hasAlpha && hasNumber && !hasSpecial) {
                warningMsg.innerText = "🔵 Moderate (Letters & Numbers)";
                warningMsg.style.display = 'block';
                warningMsg.style.color = '#60a5fa';
            } else if (code.length >= 6 && hasAlpha && hasNumber && hasSpecial) {
                warningMsg.innerText = "🔒 Perfect! You are secure.";
                warningMsg.style.display = 'block';
                warningMsg.style.color = '#10b981';
            } else if (code.length > 0) {
                warningMsg.innerText = "ℹ️ Combine Letters, Numbers & Symbols for better security.";
                warningMsg.style.display = 'block';
                warningMsg.style.color = '#9ca3af';
            }
        });

        function joinRoom() {
            const roomCode = roomInput.value.trim();
            const errorDiv = document.getElementById('error-msg');
            errorDiv.style.display = 'none';

            if (!roomCode) return;

            currentRoom = roomCode;
            socket.emit('join-room', currentRoom);
        }

        function leaveRoom() {
            if (currentRoom) {
                endCall();
                socket.emit('leave-room', currentRoom);
            }
        }

        socket.on('joined', (room) => {
            document.getElementById('setup-section').style.display = 'none';
            document.getElementById('chat-header').style.display = 'flex';
            document.getElementById('chat').style.display = 'flex';
            document.getElementById('message-form').style.display = 'flex';
            document.getElementById('room-display').innerText = `Room: ${room}`;
            
            const chat = document.getElementById('chat');
            chat.innerHTML = '';
            const sysMsg = document.createElement('p');
            sysMsg.className = 'system';
            sysMsg.innerText = `Created / Joined room: ${room}`;
            chat.appendChild(sysMsg);
        });

        socket.on('room-full', (msg) => {
            const errorDiv = document.getElementById('error-msg');
            errorDiv.innerText = msg;
            errorDiv.style.display = 'block';
        });

        socket.on('left-room', () => {
            currentRoom = "";
            document.getElementById('setup-section').style.display = 'block';
            document.getElementById('chat-header').style.display = 'none';
            document.getElementById('chat').style.display = 'none';
            document.getElementById('message-form').style.display = 'none';
            document.getElementById('chat').innerHTML = '';
            cancelReply();
            endCall();
        });

        function sendMessage() {
            const msgInput = document.getElementById('messageInput');
            const msg = msgInput.value.trim();
            if (msg && currentRoom) {
                socket.emit('send-message', { 
                    room: currentRoom, 
                    message: msg, 
                    type: 'text',
                    replyTo: activeReply 
                });
                msgInput.value = '';
                cancelReply();
            }
        }

        function setReply(text) {
            activeReply = text;
            document.getElementById('reply-bar-text').innerText = `Replying to: ${text}`;
            document.getElementById('reply-bar').style.display = 'flex';
        }

        function cancelReply() {
            activeReply = null;
            document.getElementById('reply-bar').style.display = 'none';
        }

        function handleMediaSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 200 * 1024 * 1024) {
                alert("File size exceeds 200MB limit!");
                event.target.value = '';
                return;
            }

            const reader = new FileReader();
            const isVideo = file.type.startsWith('video/');
            selectedMedia.type = isVideo ? 'video' : 'image';

            reader.onload = function(e) {
                selectedMedia.data = e.target.result;
                const container = document.getElementById('media-preview-container');
                if (isVideo) {
                    container.innerHTML = `<video src="${selectedMedia.data}" controls></video>`;
                } else {
                    container.innerHTML = `<img src="${selectedMedia.data}" alt="Preview">`;
                }
                document.getElementById('media-modal').style.display = 'flex';
            };
            reader.readAsDataURL(file);
        }

        function confirmSendMedia() {
            if (selectedMedia.data && currentRoom) {
                socket.emit('send-message', { 
                    room: currentRoom, 
                    message: selectedMedia.data, 
                    type: selectedMedia.type,
                    replyTo: activeReply 
                });
                cancelMediaPreview();
                cancelReply();
            }
        }

        function cancelMediaPreview() {
            selectedMedia = { data: null, type: null };
            document.getElementById('mediaInput').value = '';
            document.getElementById('media-modal').style.display = 'none';
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                let mimeType = 'audio/webm';
                if (!MediaRecorder.isTypeSupported(mimeType)) {
                    mimeType = 'audio/mp4'; 
                }

                mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
                audioChunks = [];
                isCancelled = false;

                mediaRecorder.ondataavailable = event => audioChunks.push(event.data);

                mediaRecorder.onstop = () => {
                    clearInterval(timerInterval);
                    stream.getTracks().forEach(track => track.stop());

                    if (!isCancelled && audioChunks.length > 0) {
                        const audioBlob = new Blob(audioChunks, { type: mimeType });
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            socket.emit('send-message', { 
                                room: currentRoom, 
                                message: e.target.result, 
                                type: 'audio',
                                replyTo: activeReply 
                            });
                            cancelReply();
                        };
                        reader.readAsDataURL(audioBlob);
                    }
                    resetRecordingUI();
                };

                mediaRecorder.start();
                secondsElapsed = 0;
                updateTimerDisplay();
                timerInterval = setInterval(() => {
                    secondsElapsed++;
                    updateTimerDisplay();
                }, 1000);

                document.getElementById('text-controls').style.display = 'none';
                document.getElementById('recording-controls').style.display = 'flex';
            } catch (err) {
                alert('Microphone access denied or not available.');
            }
        }

        function togglePause() {
            const pauseBtn = document.getElementById('pauseBtn');
            if (mediaRecorder.state === 'recording') {
                mediaRecorder.pause();
                clearInterval(timerInterval);
                pauseBtn.innerText = '▶️';
            } else if (mediaRecorder.state === 'paused') {
                mediaRecorder.resume();
                timerInterval = setInterval(() => {
                    secondsElapsed++;
                    updateTimerDisplay();
                }, 1000);
                pauseBtn.innerText = '⏸️';
            }
        }

        function cancelRecording() {
            isCancelled = true;
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        }

        function stopAndSendRecording() {
            isCancelled = false;
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        }

        function updateTimerDisplay() {
            const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
            const secs = (secondsElapsed % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${mins}:${secs}`;
        }

        function resetRecordingUI() {
            document.getElementById('recording-controls').style.display = 'none';
            document.getElementById('text-controls').style.display = 'flex';
            document.getElementById('pauseBtn').innerText = '⏸️';
            document.getElementById('timer').innerText = '00:00';
        }

        function initiateCall() {
            document.getElementById('outgoing-call-modal').style.display = 'block';
            socket.emit('request-call', { room: currentRoom });
        }

        socket.on('incoming-call', () => {
            document.getElementById('incoming-call-modal').style.display = 'block';
        });

        async function acceptCall() {
            document.getElementById('incoming-call-modal').style.display = 'none';
            socket.emit('accept-call', { room: currentRoom });
            await setupLocalMediaAndConnection();
        }

        function rejectCall() {
            document.getElementById('incoming-call-modal').style.display = 'none';
            socket.emit('reject-call', { room: currentRoom });
        }

        function cancelOutgoingCall() {
            document.getElementById('outgoing-call-modal').style.display = 'none';
            socket.emit('reject-call', { room: currentRoom });
        }

        socket.on('call-accepted', async () => {
            document.getElementById('outgoing-call-modal').style.display = 'none';
            await setupLocalMediaAndConnection();
            
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('call-user', { offer, room: currentRoom });
        });

        socket.on('call-rejected', () => {
            document.getElementById('outgoing-call-modal').style.display = 'none';
            alert("Call was declined.");
        });

        async function setupLocalMediaAndConnection() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                createPeerConnection();
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
                showCallUI();
                await getAudioOutputDevices();
            } catch (err) {
                alert('Could not access microphone.');
            }
        }

        socket.on('call-made', async (data) => {
            try {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                socket.emit('make-answer', { answer, room: currentRoom });
            } catch (err) {
                console.error('Error handling call made:', err);
            }
        });

        socket.on('answer-made', async (data) => {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        });

        socket.on('ice-candidate', (candidate) => {
            if (peerConnection) {
                peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
            }
        });

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(config);

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', { candidate: event.candidate, room: currentRoom });
                }
            };

            peerConnection.ontrack = (event) => {
                remoteAudio.srcObject = event.streams[0];
            };
        }

        function toggleMute() {
            if (localStream) {
                const audioTrack = localStream.getAudioTracks()[0];
                audioTrack.enabled = !audioTrack.enabled;
                muteBtn.innerText = audioTrack.enabled ? '🎤 Mute' : '🔇 Unmute';
            }
        }

        async function getAudioOutputDevices() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                audioDevices = devices.filter(device => device.kind === 'audiooutput');
            } catch (err) {
                console.error('Error enumerating devices:', err);
            }
        }

        async function toggleAudioOutput() {
            if (audioDevices.length === 0) return;
            
            currentDeviceIndex = (currentDeviceIndex + 1) % audioDevices.length;
            const selectedDevice = audioDevices[currentDeviceIndex];

            if (typeof remoteAudio.setSinkId === 'function') {
                try {
                    await remoteAudio.setSinkId(selectedDevice.deviceId);
                    speakerBtn.title = `Output: ${selectedDevice.label}`;
                    speakerBtn.style.color = 'var(--success-color)';
                } catch (err) {
                    console.error('Error setting sink ID:', err);
                }
            }
        }

        function endCall() {
            socket.emit('end-call', { room: currentRoom });
            closeCall();
        }

        socket.on('call-ended', () => {
            closeCall();
        });

        function closeCall() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            resetCallUI();
        }

        function showCallUI() {
            startCallBtn.style.display = 'none';
            muteBtn.style.display = 'inline-block';
            speakerBtn.style.display = 'inline-block';
            endCallBtn.style.display = 'inline-block';
        }

        function resetCallUI() {
            startCallBtn.style.display = 'inline-block';
            muteBtn.style.display = 'none';
            speakerBtn.style.display = 'none';
            endCallBtn.style.display = 'none';
            muteBtn.innerText = '🎤 Mute';
            speakerBtn.style.color = '#fff';
        }

        socket.on('receive-message', (data) => {
            const chat = document.getElementById('chat');
            
            if (data.sender === 'System') {
                const sysMsg = document.createElement('p');
                sysMsg.className = 'system';
                sysMsg.innerText = data.text;
                chat.appendChild(sysMsg);
            } else {
                const isSent = (data.sender === socket.id);
                const messageClass = isSent ? 'sent' : 'received';
                const senderLabel = isSent ? 'You: ' : 'User: ';

                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${messageClass} new-message`;

                let contentHtml = '';
                let replyBoxHtml = '';

                if (data.replyTo) {
                    replyBoxHtml = `<div class="reply-box">↩ <b>${escapeHtml(data.replyTo)}</b></div>`;
                }

                if (data.type === 'image') {
                    contentHtml = `<img src="${data.text}" alt="Image">`;
                } else if (data.type === 'video') {
                    contentHtml = `<video src="${data.text}" controls></video>`;
                } else if (data.type === 'audio') {
                    contentHtml = `<audio controls src="${data.text}"></audio>`;
                } else {
                    contentHtml = escapeHtml(data.text);
                }

                const replyText = data.type === 'text' ? data.text : (data.type.toUpperCase() + ' Media');

                msgDiv.innerHTML = `${replyBoxHtml}<strong>${senderLabel}</strong>${contentHtml}<br><span class="reply-btn">Reply</span>`;

                const replyBtn = msgDiv.querySelector('.reply-btn');
                replyBtn.addEventListener('click', () => {
                    setReply(replyText);
                });

                chat.appendChild(msgDiv);
            }
            chat.scrollTop = chat.scrollHeight;
        });

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
