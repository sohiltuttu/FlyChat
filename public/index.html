<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlyChat</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b0f19; color: #e0e6ed; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        h2 { text-align: center; color: #4da6ff; margin-bottom: 20px; }
        
        .welcome-card {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .welcome-card h3 { color: #60a5fa; margin-top: 0; margin-bottom: 8px; font-size: 18px; }
        .welcome-card p { color: #9ca3af; font-size: 14px; margin: 0; line-height: 1.5; }

        #warning-msg { color: #f59e0b; text-align: center; margin-bottom: 10px; display: none; font-size: 14px; }
        #error-msg { color: #ef4444; text-align: center; margin-bottom: 10px; display: none; font-size: 14px; }
        
        #room-selection { display: flex; justify-content: center; background-color: #111827; padding: 20px; border-radius: 8px; border: 1px solid #1f2937; margin-bottom: 15px; }
        #roomInput { padding: 12px; border: 1px solid #374151; border-radius: 6px; background-color: #1f2937; color: #fff; margin-right: 10px; width: 200px; outline: none; }
        #roomInput:focus { border-color: #2563eb; }

        button { padding: 12px 20px; border: none; border-radius: 6px; background-color: #2563eb; color: #fff; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background-color: #1d4ed8; }
        .btn-danger { background-color: #dc2626; }
        .btn-danger:hover { background-color: #b91c1c; }

        #chat-header { display: none; justify-content: space-between; align-items: center; background-color: #111827; padding: 10px 15px; border-radius: 8px 8px 0 0; border-bottom: 1px solid #1f2937; }
        #chat { border: 1px solid #1f2937; height: 400px; overflow-y: auto; padding: 20px; border-radius: 0 0 8px 8px; background-color: #111827; margin-bottom: 15px; display: flex; flex-direction: column; }
        .message { margin-bottom: 12px; padding: 10px 16px; border-radius: 18px; max-width: 70%; word-wrap: break-word; font-size: 15px; }
        .sent { background-color: #2563eb; color: #ffffff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .received { background-color: #1f2937; color: #e0e6ed; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #374151; }
        .system { color: #9ca3af; text-align: center; font-style: italic; align-self: center; font-size: 13px; margin: 8px 0; }
        
        #message-form { display: none; justify-content: space-between; background-color: #111827; padding: 10px; border-radius: 8px; border: 1px solid #1f2937; }
        #messageInput { flex: 1; padding: 12px; border: 1px solid #374151; border-radius: 6px; background-color: #1f2937; color: #fff; margin-right: 10px; outline: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>FlyChat</h2>
        
        <div class="welcome-card" id="welcome-box">
            <h3>Welcome to FlyChat 💬</h3>
            <p>Enter a unique room code below to create or join a chat room. Share the exact room code with your friend to start chatting privately!</p>
        </div>

        <div id="room-selection">
            <input type="text" id="roomInput" placeholder="Enter Room Code">
            <button onclick="joinRoom()">Join / Create</button>
        </div>

        <div id="warning-msg"></div>
        <div id="error-msg"></div>

        <div id="chat-header">
            <span id="room-display" style="font-weight: bold; color: #60a5fa;"></span>
            <button class="btn-danger" onclick="leaveRoom()">Exit Room</button>
        </div>

        <div id="chat" style="display: none;"></div>

        <div id="message-form">
            <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentRoom = "";

        function joinRoom() {
            const roomCode = document.getElementById('roomInput').value.trim();
            const warningDiv = document.getElementById('warning-msg');
            const errorDiv = document.getElementById('error-msg');
            
            warningDiv.style.display = 'none';
            errorDiv.style.display = 'none';

            if (!roomCode) return;

            if (roomCode.length <= 4) {
                warningDiv.innerText = "Warning: Short room codes like '" + roomCode + "' are easy to guess! Use a longer unique code (5+ characters) for better safety.";
                warningDiv.style.display = 'block';
            }

            currentRoom = roomCode;
            socket.emit('join-room', currentRoom);
        }

        function leaveRoom() {
            if (currentRoom) {
                socket.emit('leave-room', currentRoom);
            }
        }

        socket.on('joined', (room) => {
            document.getElementById('welcome-box').style.display = 'none';
            document.getElementById('room-selection').style.display = 'none';
            document.getElementById('warning-msg').style.display = 'none';
            document.getElementById('error-msg').style.display = 'none';
            
            document.getElementById('chat-header').style.display = 'flex';
            document.getElementById('chat').style.display = 'flex';
            document.getElementById('message-form').style.display = 'flex';
            
            document.getElementById('room-display').innerText = `Room: ${room}`;
            document.getElementById('chat').innerHTML = `<p class="system">Created / Joined room: ${room}</p>`;
        });

        socket.on('room-full', (msg) => {
            const errorDiv = document.getElementById('error-msg');
            errorDiv.innerText = msg;
            errorDiv.style.display = 'block';
        });

        socket.on('left-room', () => {
            currentRoom = "";
            document.getElementById('welcome-box').style.display = 'block';
            document.getElementById('room-selection').style.display = 'flex';
            document.getElementById('chat-header').style.display = 'none';
            document.getElementById('chat').style.display = 'none';
            document.getElementById('message-form').style.display = 'none';
            document.getElementById('chat').innerHTML = '';
            document.getElementById('roomInput').value = '';
        });

        function sendMessage() {
            const msgInput = document.getElementById('messageInput');
            const msg = msgInput.value.trim();
            if (msg && currentRoom) {
                socket.emit('send-message', { room: currentRoom, message: msg });
                msgInput.value = '';
            }
        }

        socket.on('receive-message', (data) => {
            const chat = document.getElementById('chat');
            const messageClass = (data.sender === socket.id) ? 'sent' : (data.sender === 'System' ? 'system' : 'received');
            const senderLabel = (data.sender === 'System') ? '' : (data.sender === socket.id ? 'You: ' : 'User: ');
            
            if (data.sender === 'System') {
                chat.innerHTML += `<p class="system">${data.text}</p>`;
            } else {
                chat.innerHTML += `<div class="message ${messageClass}"><strong>${senderLabel}</strong>${data.text}</div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        });
    </script>
</body>
</html>
